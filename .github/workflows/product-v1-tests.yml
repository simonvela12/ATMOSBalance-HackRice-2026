name: Product Validation

on:
  push:
    branches:
      - product-v1.4-clean-integration
  workflow_dispatch:

concurrency:
  group: product-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Test banking FinanceCore
        id: banking
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee banking-financecore.log

      - name: Test FinancialCore engine
        id: engine
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path FinancialCore 2>&1 | tee financialcore-engine.log

      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-diagnostics
          path: |
            banking-financecore.log
            financialcore-engine.log
          if-no-files-found: warn

      - name: Fail if core validation failed
        if: steps.banking.outcome != 'success' || steps.engine.outcome != 'success'
        run: exit 1

  ios-build:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build iOS product shell
        id: ios
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Finanzas2026/Finanzas2026.xcodeproj \
            -scheme Finanzas2026 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-build.log

      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: ios-build.log
          if-no-files-found: warn

      - name: Fail if iOS validation failed
        if: steps.ios.outcome != 'success'
        run: exit 1
