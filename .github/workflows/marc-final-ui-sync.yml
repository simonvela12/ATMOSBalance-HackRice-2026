name: Apply Marc Final UI Details

on:
  push:
    branches:
      - product-v1.4-clean-integration
    paths:
      - .github/workflows/marc-final-ui-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: product-v1.4-clean-integration
          fetch-depth: 0

      - name: Reconcile Marc final UI details with SmartGoalEngine
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('Finanzas2026/Finanzas2026/ContentView.swift')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing integration anchor: {label}')
              s = s.replace(old, new, 1)

          # Marc's final hero made spendable cash prominent. Keep the aesthetic,
          # but source the number from Carlos's SmartGoalEngine rather than a UI formula.
          replace_once(
          '''            Text(month.balanceLabel)
                          .font(.helvetica(.title3, weight: .medium))
                          .foregroundStyle(.white.opacity(0.9))

                      HStack(spacing: 8) {''',
          '''            Text(month.balanceLabel)
                          .font(.helvetica(.title3, weight: .medium))
                          .foregroundStyle(.white.opacity(0.9))

                      if let safeToSpend = goalPortfolio?.safeToSpendToday {
                          HStack(spacing: 5) {
                              Text("\\(safeToSpend.currencyText) spendable")
                                  .font(.helvetica(.headline, weight: .semibold))
                                  .monospacedDigit()
                              Image(systemName: "checkmark.shield.fill")
                                  .font(.system(size: 13, weight: .semibold))
                                  .foregroundStyle(Color.rainMist)
                          }
                          .foregroundStyle(.white.opacity(0.72))
                      }

                      HStack(spacing: 8) {''',
          'hero safe-to-spend')

          # Marc's last calendar commit displayed goal deadlines inside the calendar.
          replace_once(
          '''            CalendarForecastSheet(
                          month: month,
                          onRename: renameEntry,
                          onDelete: deleteEntry
                      )''',
          '''            CalendarForecastSheet(
                          month: month,
                          goals: displayGoals,
                          onRename: renameEntry,
                          onDelete: deleteEntry
                      )''',
          'calendar sheet call')

          replace_once(
          '''private struct CalendarForecastSheet: View {
              let month: MonthForecast
              let onRename: (ForecastEntryTarget, String, OccurrenceScope) -> Void''',
          '''private struct CalendarForecastSheet: View {
              let month: MonthForecast
              let goals: [FinancialGoal]
              let onRename: (ForecastEntryTarget, String, OccurrenceScope) -> Void''',
          'calendar goals input')

          replace_once(
          '''    private var leadingSpaces: Int {
                  var components = DateComponents()
                  components.year = month.month.year
                  components.month = month.month.monthNumber
                  components.day = 1
                  let date = Calendar.current.date(from: components) ?? .now
                  return Calendar.current.component(.weekday, from: date) - 1
              }

              var body: some View {''',
          '''    private var leadingSpaces: Int {
                  var components = DateComponents()
                  components.year = month.month.year
                  components.month = month.month.monthNumber
                  components.day = 1
                  let date = Calendar.current.date(from: components) ?? .now
                  return Calendar.current.component(.weekday, from: date) - 1
              }

              private var monthlyNet: Int {
                  month.days.reduce(0) { $0 + $1.amount }
              }

              private func goals(on day: ForecastDay) -> [FinancialGoal] {
                  var components = DateComponents()
                  components.calendar = Calendar(identifier: .gregorian)
                  components.year = month.month.year
                  components.month = month.month.monthNumber
                  components.day = day.day
                  guard let date = components.date else { return [] }

                  return goals
                      .filter { Calendar.current.isDate($0.targetDate, inSameDayAs: date) }
                      .sorted {
                          if $0.priority.rank == $1.priority.rank { return $0.name < $1.name }
                          return $0.priority.rank < $1.priority.rank
                      }
              }

              var body: some View {''',
          'calendar helpers')

          replace_once(
          '''                        ForEach(month.days) { day in
                              Button { selectedDay = day } label: {
                                  CalendarDayCell(day: day)
                              }
                              .buttonStyle(.plain)
                          }''',
          '''                        ForEach(month.days) { day in
                              Button { selectedDay = day } label: {
                                  CalendarDayCell(day: day, goals: goals(on: day))
                              }
                              .buttonStyle(.plain)
                          }''',
          'calendar goal cells')

          replace_once(
          '''                    .padding(12)
                      .background(.black.opacity(0.18), in: RoundedRectangle(cornerRadius: 18, style: .continuous))

                      Text("Tap any day for its income and spending breakdown.")''',
          '''                    .padding(12)
                      .background(.black.opacity(0.18), in: RoundedRectangle(cornerRadius: 18, style: .continuous))

                      HStack(spacing: 7) {
                          Image(systemName: monthlyNet >= 0 ? "arrow.up.right" : "arrow.down.right")
                          Text("Monthly net")
                          Text(Double(monthlyNet).signedCalendarCurrencyText)
                              .fontWeight(.bold)
                              .monospacedDigit()
                      }
                      .font(.helvetica(.subheadline))
                      .foregroundStyle(.white.opacity(0.7))

                      Text("Tap any day for its income and spending breakdown.")''',
          'calendar monthly net')

          old_cell = '''private struct CalendarDayCell: View {
              let day: ForecastDay

              var body: some View {
                  VStack(spacing: 5) {
                      Text("\\(day.day)")
                          .font(.helvetica(.caption, weight: day.status == .today ? .bold : .medium))
                      if day.amount != 0 {
                          Image(systemName: day.weather.symbol)
                              .font(.system(size: 15))
                              .symbolRenderingMode(.palette)
                              .foregroundStyle(day.weather.primaryColor, day.weather.secondaryColor)
                          Text(day.formattedAmount)
                              .font(.helvetica(.caption2, weight: .semibold))
                              .minimumScaleFactor(0.65)
                      } else {
                          Spacer().frame(height: 27)
                          Text("—").font(.helvetica(.caption2)).foregroundStyle(.white.opacity(0.28))
                      }
                  }
                  .foregroundStyle(.white)
                  .frame(maxWidth: .infinity, minHeight: 70)
                  .background(day.status == .today ? Color.sunGold.opacity(0.18) : .white.opacity(day.amount == 0 ? 0.035 : 0.08), in: RoundedRectangle(cornerRadius: 10, style: .continuous))
                  .overlay {
                      if day.status == .today {
                          RoundedRectangle(cornerRadius: 10, style: .continuous).stroke(Color.sunGold.opacity(0.65))
                      }
                  }
              }
          }'''

          new_cell = '''private struct CalendarDayCell: View {
              let day: ForecastDay
              let goals: [FinancialGoal]

              private var visibleGoals: [FinancialGoal] {
                  Array(goals.prefix(goals.count > 2 ? 2 : goals.count))
              }

              private var goalIconSize: CGFloat {
                  goals.count <= 1 ? 13 : 9
              }

              var body: some View {
                  VStack(spacing: 4) {
                      HStack(spacing: 2) {
                          Text("\\(day.day)")
                              .font(.helvetica(.caption, weight: day.status == .today ? .bold : .medium))
                          Spacer(minLength: 1)
                          ForEach(visibleGoals) { goal in
                              Image(systemName: goal.symbol)
                                  .font(.system(size: goalIconSize, weight: .semibold))
                                  .foregroundStyle(Color.rainMist)
                          }
                          if goals.count > visibleGoals.count {
                              Text("+\\(goals.count - visibleGoals.count)")
                                  .font(.helvetica(size: 7, weight: .bold))
                                  .foregroundStyle(.white.opacity(0.7))
                          }
                      }
                      .frame(maxWidth: .infinity, minHeight: 14)

                      if day.amount != 0 {
                          Image(systemName: day.weather.symbol)
                              .font(.system(size: 15))
                              .symbolRenderingMode(.palette)
                              .foregroundStyle(day.weather.primaryColor, day.weather.secondaryColor)
                          Text(Double(day.amount).signedCalendarCurrencyText)
                              .font(.helvetica(.caption2, weight: .semibold))
                              .lineLimit(1)
                              .minimumScaleFactor(0.35)
                              .allowsTightening(true)
                              .frame(maxWidth: .infinity)
                      } else {
                          Spacer().frame(height: 26)
                          Text("—").font(.helvetica(.caption2)).foregroundStyle(.white.opacity(0.28))
                      }
                  }
                  .padding(.horizontal, 3)
                  .foregroundStyle(.white)
                  .frame(maxWidth: .infinity, minHeight: 72)
                  .background(day.status == .today ? Color.sunGold.opacity(0.18) : .white.opacity(day.amount == 0 ? 0.035 : 0.08), in: RoundedRectangle(cornerRadius: 10, style: .continuous))
                  .overlay {
                      if day.status == .today {
                          RoundedRectangle(cornerRadius: 10, style: .continuous).stroke(Color.sunGold.opacity(0.65))
                      }
                  }
                  .accessibilityElement(children: .combine)
                  .accessibilityHint(goals.isEmpty ? "" : "Goal deadline")
              }
          }'''
          replace_once(old_cell, new_cell, 'Marc calendar day cell')

          anchor = '''    var negativeCurrencyText: String {'''
          if 'var signedCalendarCurrencyText: String' not in s:
              if anchor not in s:
                  raise SystemExit('missing integration anchor: Double currency extension')
              helper = '''    var signedCalendarCurrencyText: String {
                  let wholeDollarText = abs(self).formatted(
                      .currency(code: "USD").precision(.fractionLength(0))
                  )
                  if self > 0 { return "+\\(wholeDollarText)" }
                  if self < 0 { return "−\\(wholeDollarText)" }
                  return 0.0.formatted(.currency(code: "USD").precision(.fractionLength(0)))
              }

          '''
              s = s.replace(anchor, helper + anchor, 1)

          path.write_text(s)
          PY

      - name: Commit reconciled UI
        run: |
          git config user.name "Codex Integration"
          git config user.email "codex-integration@users.noreply.github.com"
          git add Finanzas2026/Finanzas2026/ContentView.swift
          git diff --cached --check
          git commit -m "Reapply Marc final goal and calendar UI over shared engines"
          git push origin HEAD:product-v1.4-clean-integration
